name: aiga-dallas

x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run make setup first}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', 'local');
    define('WP_DEBUG_DISPLAY', false);
    define('WP_DEBUG_LOG', true);
    define('DISALLOW_FILE_EDIT', true);
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('DISABLE_WP_CRON', true);
    define('WP_HTTP_BLOCK_EXTERNAL', true);

x-wordpress-volumes: &wordpress-volumes
  - wordpress:/var/www/html
  - ./themes/ikit_three:/var/www/html/wp-content/themes/ikit_three:ro
  - ./themes/ikit_three_custom:/var/www/html/wp-content/themes/ikit_three_custom
  - ./.local/plugins:/var/www/html/wp-content/plugins

services:
  db:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run make setup first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run make setup first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 40

  wordpress:
    image: wordpress:php8.3-apache@sha256:81a34254acaa6ff3b9a67268c2745e9a041c4094cbe5ccd35b75ed3bbdc033b5
    environment: *wordpress-environment
    volumes: *wordpress-volumes
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost/wp-includes/css/dashicons.min.css > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, ingress]
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -Y off -q -O /dev/null http://127.0.0.1/wp-includes/css/dashicons.min.css"]
      interval: 3s
      timeout: 5s
      retries: 20

  cli:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *wordpress-environment
      WP_ADMIN_USER: ${WP_ADMIN_USER:-developer}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Run make setup first}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-developer@example.test}
      WORDPRESS_PORT: ${WORDPRESS_PORT:-8080}
    volumes: *wordpress-volumes
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy

volumes:
  wordpress:
  database:

# Legacy iKit tasks use both WordPress HTTP and native cURL. Keep this local
# application network offline. Only the HTTP gateway joins the ingress network.
networks:
  default:
    internal: true
  ingress:
